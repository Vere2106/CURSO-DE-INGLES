<header class="sticky top-0 z-50 border-b border-ink-200 bg-white/90 backdrop-blur">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 sm:px-8" aria-label="Principal">
    <a href="#inicio" class="text-lg font-extrabold text-ink-900">
      Curso de <span class="text-brand-700">Inglés</span>
    </a>

    <div class="hidden items-center gap-8 text-sm font-semibold text-ink-700 md:flex">
      <a href="#curso" class="transition hover:text-brand-700">El curso</a>
      <a href="#inscripcion" class="transition hover:text-brand-700">Inscripción</a>
      <a href="#inscripcion" class="btn-primary px-5 py-2.5 text-sm">Inscribirme</a>
    </div>

    <button
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-full text-ink-900 transition hover:bg-ink-200 md:hidden"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuOpen.set(!menuOpen())"
    >
      @if (menuOpen()) {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      }
    </button>
  </nav>

  @if (menuOpen()) {
    <div id="mobile-menu" class="border-t border-ink-200 bg-white px-5 py-4 md:hidden">
      <div class="flex flex-col gap-1 text-base font-semibold text-ink-900">
        <a href="#curso" class="rounded-xl px-3 py-3 transition hover:bg-brand-50" (click)="menuOpen.set(false)">El curso</a>
        <a href="#inscripcion" class="rounded-xl px-3 py-3 transition hover:bg-brand-50" (click)="menuOpen.set(false)">Inscripción</a>
        <a href="#inscripcion" class="btn-primary mt-2" (click)="menuOpen.set(false)">Inscribirme</a>
      </div>
    </div>
  }
</header>
